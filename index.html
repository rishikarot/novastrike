<style>
*{box-sizing:border-box}html{background:#070c1f}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 0%,#273267 0%,#11152d 45%,#070b18 100%);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f8ff}

.top{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:12px 14px 10px;background:linear-gradient(110deg,#141a3d,#192047);min-height:70px}.brand{font-size:21px;line-height:.97;font-weight:1000;letter-spacing:1px;font-style:italic;text-shadow:0 0 20px #b389ff55;white-space:nowrap}.brand span{color:#7ffae3}.brand small{display:block;font-size:8px;letter-spacing:2.8px;font-style:normal;color:#9aa8d7;margin-top:5px}.stat{text-align:center;flex-shrink:0}.stat small{display:block;color:#8e9ec9;font-size:9px;font-weight:800;letter-spacing:1px}.stat strong{display:block;font-size:18px;line-height:1.25;font-variant-numeric:tabular-nums;font-weight:900}.stat .hp{color:#fb6c9d;letter-spacing:1px}.mini{border:1px solid #52649180;border-radius:10px;width:30px;height:30px;background:#202951;color:#e9f5ff;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}.mini:active{background:#3b4880}
.progress{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#101731;border-top:1px solid #37457455;border-bottom:1px solid #5267a844}.progress label{font-size:9px;letter-spacing:1.5px;color:#9daed7;font-weight:850;white-space:nowrap}.meter{flex:1;height:6px;border-radius:9px;background:#303b69;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#55f3d4,#a78aff);box-shadow:0 0 9px #7ceade;transition:width .2s}.power{font-size:9px;color:#fbd48a;min-width:49px;text-align:right;font-weight:900}
.stage{position:relative;background:#090f25;width:100%;overflow:hidden}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:460/550;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;background:linear-gradient(180deg,#0a1031e8,#0d1332f4);z-index:4}.overlay[hidden]{display:none}.menu{width:100%;max-width:365px}.logoicon{margin:auto auto 10px;width:71px;height:71px;border-radius:21px;display:grid;place-items:center;font-size:39px;color:#83ffe0;background:linear-gradient(145deg,#6affdf25,#aa73ff25);border:1px solid #72f5d899;box-shadow:0 0 42px #48e9ca35}.eyebrow{font-size:10px;font-weight:900;letter-spacing:3px;color:#91ffe1;margin-bottom:9px}.menu h1{font-size:clamp(37px,10vw,49px);line-height:.96;letter-spacing:-1.8px;font-style:italic;font-weight:1000;margin:0 0 13px;text-shadow:0 4px 25px #986cff66}.menu h1 span{color:#80ffe3}.menu p{color:#bac7ed;font-size:13px;line-height:1.55;max-width:300px;margin:0 auto 16px}.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}.chips span{border:1px solid #5d689d85;border-radius:6px;background:#ffffff0a;padding:7px 10px;font-size:10px;color:#cdd9ff;font-weight:750}.primary{background:linear-gradient(105deg,#77f9df,#8e9bff);box-shadow:0 5px 0 #42529f,0 8px 26px #6cebd440;border:0;border-radius:12px;color:#0b1733;font-size:16px;font-weight:950;min-width:190px;padding:14px 26px;cursor:pointer}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #42529f}.sub{border:0;color:#b7c5f5;font-size:12px;font-weight:800;background:transparent;padding:15px;cursor:pointer}.extra{margin-top:18px;color:#9cabd3;font-size:11px}.scorefinal{color:#81ffe4;font-size:37px;font-weight:1000;margin:6px auto 17px}.controls{display:flex;gap:9px;padding:10px 13px;background:#141b3b;touch-action:none}.pad{height:52px;flex:1;border:1px solid #5c6aab;border-radius:13px;background:#252f5e;color:#dce7ff;font-size:20px;font-weight:900;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}.pad.shoot{flex:1.6;background:linear-gradient(120deg,#62e5cd,#89a5ff);color:#0e1b3a;border:0;font-size:14px;letter-spacing:1.2px;box-shadow:0 4px 0 #3d588c}.pad.active{transform:translateY(2px);filter:brightness(1.35);box-shadow:none}.foot{padding:9px;text-align:center;color:#8493c3;font-size:9px;font-weight:800;letter-spacing:1.5px;background:#0d132c}.foot b{color:#b2c5ef}.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#121d49d9;border:1px solid #6cf4d58f;color:#dffefa;white-space:nowrap;z-index:2;font-size:11px;letter-spacing:1px;font-weight:900;padding:9px 15px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:400px){body{padding:4px;align-items:flex-start}.top{padding:9px 8px;gap:4px;min-height:62px}.brand{font-size:18px}.brand small{font-size:7px;letter-spacing:2px}.stat strong{font-size:16px}.mini{width:27px;height:28px}.progress{padding:6px 9px}.controls{gap:7px;padding:8px}.pad{height:48px}.menu h1{font-size:37px}.menu p{font-size:12px}.chips{margin-bottom:13px}.logoicon{height:55px;width:55px;font-size:30px;margin-bottom:7px}}
@media(prefers-reduced-motion:reduce){.fill,.toast{transition:none}}
</style>

<body>
<div id="nova">
 <header class="top"><div class="brand">NOVA <span>STRIKE</span><small>GALAXY DEFENSE</small></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>LEVEL</small><strong id="level">01/12</strong></div><div class="stat"><small>HULL</small><strong id="health" class="hp">♥♥♥</strong></div><button class="mini" id="pause" aria-label="Pause">Ⅱ</button><button class="mini" id="sound" aria-label="Sound">♫</button></header>
 <div class="progress"><label id="mission">NEON OUTPOST</label><div class="meter"><div id="fill" class="fill"></div></div><div class="power" id="power">READY</div></div>
 <div class="stage"><canvas id="field" width="460" height="550" aria-label="Nova Strike shooting game"></canvas><div id="toast" class="toast"></div><div class="overlay" id="overlay"><div class="menu"><div class="logoicon" id="symbol">✦</div><div class="eyebrow" id="eyebrow">THE GALAXY NEEDS YOU</div><h1 id="heading">NOVA <span>STRIKE</span></h1><p id="description">Blast alien drones, dodge incoming fire, collect upgrades and take down the giant bosses.</p><div class="chips" id="chips"><span>12 LEVELS</span><span>6 TARGET TYPES</span><span>3 BOSSES</span></div><div id="finalscore" class="scorefinal" hidden></div><button class="primary" id="main">START MISSION →</button><div><button class="sub" id="restart" hidden>Restart from Level 1</button></div><div class="extra" id="help">◀ ▶ to steer · Hold FIRE to shoot · P to pause</div></div></div></div>
 <div class="controls"><button class="pad" id="left" aria-label="Move left">◀</button><button class="pad" id="right" aria-label="Move right">▶</button><button class="pad shoot" id="fire" aria-label="Shoot">✦ FIRE</button></div>
 <footer class="foot">BUILT FOR ARCADE FUN <span style="color:#66e6d1">✦</span> <b>NOVA STRIKE</b></footer>
</div>
<script>
(()=>{
const root=document.getElementById('nova');if(root.dataset.ready)return;root.dataset.ready='1';
const $=id=>root.querySelector('#'+id),canvas=$('field'),g=canvas.getContext('2d'),W=460,H=550;
const names=['NEON OUTPOST','DROID DRIFT','ASTEROID ALLEY','THE SENTINEL','PLASMA STORM','PHANTOM FLEET','GRAVITY WELL','IRON TITAN','STARFALL RUSH','VOID INVASION','FINAL APPROACH','OMEGA CORE'];
const palette={scout:'#66e7df',zig:'#ff6fb3',rock:'#a99dff',mine:'#ffb875',turret:'#fd777d',crate:'#fff08c',boss:'#f07aff'};
let mode='menu',score=0,level=1,hp=3,ship={x:230,y:494,inv:0},shots=[],targets=[],enemyShots=[],fx=[],floaters=[],stars=[],keys={left:false,right:false,fire:false},soundOn=true,audio=null,raf=0,last=0,elapsed=0,spawned=0,quota=0,spawnTimer=0,phase='wave',phaseTime=0,bossMade=false,flash=0,shake=0,shotTimer=0,boosts={triple:0,rapid:0,shield:0},toastUntil=0,runSerial=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:rand(.4,2),z:rand(.2,1.5),a:rand(.2,.85)});
function beep(f=500,d=.07,type='sine',v=.035){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),gain=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(70,f*.55),audio.currentTime+d);gain.gain.setValueAtTime(v,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(gain);gain.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resetKeys(){for(const k in keys)keys[k]=false;root.querySelectorAll('.pad.active').forEach(e=>e.classList.remove('active'))}
function banner(s){$('toast').textContent=s;$('toast').classList.add('show');toastUntil=elapsed+1.5}
function updateHUD(){ $('score').textContent=score.toLocaleString();$('level').textContent=String(level).padStart(2,'0')+'/12';$('health').textContent='♥'.repeat(hp)+'♡'.repeat(3-hp);$('mission').textContent=names[level-1];const done=phase==='boss'?Math.max(.02,1-(targets.find(t=>t.type==='boss')?.hp||1)/(20+level*5)):phase==='clear'?1:spawned/quota*.70;const progress=phase==='boss'?.7+done*.3:phase==='clear'?1:clamp(done,0,.70);$('fill').style.width=(progress*100)+'%';let current=Object.entries(boosts).filter(([k,v])=>v>elapsed).map(([k])=>k);$('power').textContent=current.length?current.map(k=>k==='triple'?'TRIPLE':k==='rapid'?'RAPID':'SHIELD').join(' + '):'READY';}
function showMenu(which){$('overlay').hidden=false;$('restart').hidden=which!=='pause';$('chips').hidden=which!=='menu';$('finalscore').hidden=which==='menu'||which==='pause';$('help').hidden=which!=='menu';let copy={menu:['✦','THE GALAXY NEEDS YOU','NOVA <span>STRIKE</span>','Blast alien drones, dodge incoming fire, collect upgrades and take down the giant bosses.','START MISSION →'],pause:['Ⅱ','MISSION PAUSED','TAKE A <span>BREATHER</span>','Your ship is safe. Ready to defend the galaxy again?','RESUME GAME →'],over:['×','SHIP DESTROYED','MISSION <span>FAILED</span>','The galaxy needs another hero. Reload and try again!','TRY AGAIN ↻'],win:['★','ALL 12 LEVELS CLEARED','GALAXY <span>SAVED!</span>','Incredible flying! You defeated every boss and secured the stars.','PLAY AGAIN ↻']}[which];$('symbol').textContent=copy[0];$('eyebrow').textContent=copy[1];$('heading').innerHTML=copy[2];$('description').textContent=copy[3];$('main').textContent=copy[4];$('finalscore').textContent='SCORE  '+score.toLocaleString();}
function initLevel(){spawned=0;quota=11+level*2;spawnTimer=.65;phase='wave';phaseTime=0;bossMade=false;targets=[];shots=[];enemyShots=[];ship.x=W/2;ship.inv=elapsed+1.5;banner('LEVEL '+level+'  ·  '+names[level-1]);updateHUD();}
function start(){cancelAnimationFrame(raf);runSerial++;score=0;hp=3;level=1;elapsed=0;ship.x=W/2;shots=[];targets=[];enemyShots=[];fx=[];floaters=[];boosts={triple:0,rapid:0,shield:0};shotTimer=0;resetKeys();mode='play';$('overlay').hidden=true;initLevel();last=performance.now();beep(720,.2,'triangle');raf=requestAnimationFrame(loop)}
function pause(){if(mode!=='play')return;mode='pause';resetKeys();cancelAnimationFrame(raf);$('pause').textContent='▶';showMenu('pause')}
function resume(){if(mode!=='pause')return;mode='play';$('overlay').hidden=true;$('pause').textContent='Ⅱ';last=performance.now();raf=requestAnimationFrame(loop)}
function finish(won){mode=won?'win':'over';resetKeys();cancelAnimationFrame(raf);showMenu(won?'win':'over');beep(won?920:160,.45,'sawtooth',.06)}
function spawnTarget(){let options=['scout','scout','scout','zig'];if(level>=2)options.push('rock');if(level>=3)options.push('mine');if(level>=4)options.push('turret');if(level>=6)options.push('zig','rock','turret');let type=spawned>0&&spawned%7===0?'crate':options[Math.floor(Math.random()*options.length)];let w=type==='rock'?34:type==='turret'?34:type==='crate'?29:30,h=w;targets.push({type,x:rand(30,W-60),y:-50,w,h,hp:type==='rock'?2:type==='turret'?3:1,maxhp:type==='rock'?2:type==='turret'?3:1,age:0,seed:rand(0,6.28),fire:rand(2,4),speed:rand(.75,1.05)*(1+level*.095)});spawned++}
function makeBoss(){phase='boss';bossMade=true;const life=20+level*5;targets.push({type:'boss',x:W/2-57,y:65,w:114,h:72,hp:life,maxhp:life,age:0,fire:1.1,seed:0,speed:0});banner('⚠ BOSS APPROACHING ⚠');beep(190,.36,'sawtooth',.06);updateHUD()}
function fire(){if(mode!=='play'||shotTimer>0||phase==='clear')return;const triple=boosts.triple>elapsed;shots.push({x:ship.x,y:ship.y-24,dx:0,dy:-10.5,damage:1});if(triple){shots.push({x:ship.x-8,y:ship.y-15,dx:-2,dy:-9.8,damage:1},{x:ship.x+8,y:ship.y-15,dx:2,dy:-9.8,damage:1})}shotTimer=boosts.rapid>elapsed?.11:.215;beep(650,.045,'triangle',.018)}
function particles(x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),spd=rand(35,175);fx.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:rand(.25,.7),max:.7,color,r:rand(1.5,4)})}}
function popText(x,y,msg,color){floaters.push({x,y,msg,color,life:.8})}
function awardUpgrade(x,y){const k=['shield','triple','rapid'][Math.floor(Math.random()*3)];boosts[k]=elapsed+9;popText(x,y,k==='shield'?'SHIELD +9s':k==='triple'?'TRIPLE SHOT':'RAPID FIRE','#fff08c');banner('POWER UP  ·  '+k.toUpperCase());beep(1050,.24,'sine');updateHUD()}
function killTarget(i){const t=targets[i];if(!t)return;let add={scout:100,zig:150,rock:200,mine:200,turret:250,crate:100,boss:1500}[t.type];score+=add;particles(t.x+t.w/2,t.y+t.h/2,palette[t.type],t.type==='boss'?70:15);popText(t.x+t.w/2,t.y,'+'+add,palette[t.type]);shake=t.type==='boss'?12:3;targets.splice(i,1);if(t.type==='crate')awardUpgrade(t.x,t.y);if(t.type==='mine'){for(const other of targets)if(Math.hypot(other.x-t.x,other.y-t.y)<75){other.hp-=2;particles(other.x,other.y,'#ffc479',5)}}if(t.type==='boss'){banner('BOSS DEFEATED!');beep(950,.35,'triangle');}else beep(285,.1,'square',.028);updateHUD()}
function damage(){if(mode!=='play'||elapsed<ship.inv||phase==='clear')return;if(boosts.shield>elapsed){ship.inv=elapsed+.25;particles(ship.x,ship.y,'#7fffe8',12);beep(500,.07);return}hp--;flash=.25;shake=14;ship.inv=elapsed+1.5;particles(ship.x,ship.y,'#ff7398',22);beep(150,.22,'sawtooth');updateHUD();if(hp<=0)finish(false)}
const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)*.5&&Math.abs(a.y-b.y)<(a.h+b.h)*.5;
function update(dt){const factor=dt*60;elapsed+=dt;shotTimer=Math.max(0,shotTimer-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*24);
if(elapsed>toastUntil)$('toast').classList.remove('show');for(let s of stars){s.y+=s.z*(25+level*2)*dt;if(s.y>H)s.y=0}
for(let p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}fx=fx.filter(p=>p.life>0);for(let f of floaters){f.y-=34*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);
if(phase==='clear'){phaseTime-=dt;if(phaseTime<=0){if(level===12){finish(true);return}level++;initLevel()}return}
let move=(keys.right?1:0)-(keys.left?1:0);ship.x=clamp(ship.x+move*325*dt,22,W-22);if(keys.fire)fire();
if(phase==='wave'){spawnTimer-=dt;if(spawnTimer<=0&&spawned<quota){spawnTarget();spawnTimer=clamp(.71-level*.023,.4,.71)+rand(-.12,.15)}if(spawned>=quota&&targets.length===0){if(level%4===0&&!bossMade)makeBoss();else{phase='clear';phaseTime=2.2;banner(level===12?'GALAXY SECURED!':'LEVEL CLEAR!');beep(810,.22);updateHUD();return}}}
for(const t of targets){t.age+=dt;if(t.type==='boss'){t.x=W/2-t.w/2+Math.sin(t.age*1.1)*138;t.y=58+Math.sin(t.age*2)*12;t.fire-=dt;if(t.fire<0){for(let a of [-.33,0,.33])enemyShots.push({x:t.x+t.w/2,y:t.y+t.h,dx:Math.sin(a)*118,dy:210+level*6,r:5});t.fire=1.4}}else{t.y+=t.speed*58*dt;if(t.type==='zig')t.x+=Math.sin(t.age*5+t.seed)*95*dt;else if(t.type==='scout')t.x+=Math.sin(t.age*3+t.seed)*28*dt;else if(t.type==='rock')t.x+=Math.cos(t.age*2+t.seed)*24*dt;else if(t.type==='mine')t.x+=Math.sin(t.age*3+t.seed)*40*dt;t.x=clamp(t.x,5,W-t.w-5);if(t.type==='turret'&&t.y<370){t.fire-=dt;if(t.fire<=0){enemyShots.push({x:t.x+t.w/2,y:t.y+t.h,dx:(ship.x-(t.x+t.w/2))*.18,dy:175+level*7,r:4});t.fire=rand(2.6,3.7)}}}}
for(let i=shots.length-1;i>=0;i--){let b=shots[i];b.x+=b.dx*factor;b.y+=b.dy*factor;if(b.y<-20||b.x<-15||b.x>W+15){shots.splice(i,1);continue}for(let j=targets.length-1;j>=0;j--){let t=targets[j];if(b.x>t.x-4&&b.x<t.x+t.w+4&&b.y>t.y-8&&b.y<t.y+t.h+5){shots.splice(i,1);t.hp-=b.damage;particles(b.x,b.y,palette[t.type],3);if(t.hp<=0)killTarget(j);else beep(180,.025,'triangle',.01);break}}}
for(let i=enemyShots.length-1;i>=0;i--){let b=enemyShots[i];b.x+=b.dx*dt;b.y+=b.dy*dt;if(b.y>H+10||b.x<-20||b.x>W+20){enemyShots.splice(i,1);continue}if(Math.hypot(b.x-ship.x,b.y-ship.y)<21){enemyShots.splice(i,1);damage();if(mode!=='play')return}}
for(let i=targets.length-1;i>=0;i--){let t=targets[i];if(t.hp<=0){killTarget(i);continue}if(t.type!=='boss'&&t.y>H+10){targets.splice(i,1);if(t.type!=='crate')damage();if(mode!=='play')return;continue}if(t.type!=='boss'&&Math.abs(t.x+t.w/2-ship.x)<(t.w+29)/2&&Math.abs(t.y+t.h/2-ship.y)<(t.h+25)/2){targets.splice(i,1);particles(ship.x,ship.y,'#ffa9bd',12);damage();if(mode!=='play')return}}
if(phase==='boss'&&targets.length===0){phase='clear';phaseTime=2.2;banner(level===12?'GALAXY SECURED!':'BOSS DEFEATED · LEVEL CLEAR!');beep(1000,.3);}
updateHUD()}
function path(points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function round(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function glow(x,y,r,color){let grd=g.createRadialGradient(x,y,0,x,y,r);grd.addColorStop(0,color);grd.addColorStop(1,'transparent');g.fillStyle=grd;g.fillRect(x-r,y-r,r*2,r*2)}
function drawTarget(t){let x=t.x,y=t.y,w=t.w,h=t.h,c=palette[t.type];g.save();g.shadowBlur=t.type==='boss'?30:14;g.shadowColor=c;if(t.type==='scout'){path([[x+w/2,y],[x+w,y+11],[x+w-6,y+h-3],[x+6,y+h-3],[x,y+11]],'#31c0bc');path([[x+7,y+11],[x+w/2,y+4],[x+w-7,y+11],[x+w/2,y+23]],'#c1fffa');round(x+w/2-3,y+9,6,6,3,'#18244d')}
else if(t.type==='zig'){path([[x,y+7],[x+12,y+10],[x+15,y],[x+19,y+10],[x+w,y+7],[x+w-8,y+h-3],[x+8,y+h-3]],'#f06aa5');round(x+11,y+13,9,6,3,'#fff4fc')}
else if(t.type==='rock'){g.fillStyle='#746cbd';g.beginPath();for(let k=0;k<9;k++){let a=k*2*Math.PI/9,r=k%2===0?w*.47:w*.37;let px=x+w/2+Math.cos(a)*r,py=y+h/2+Math.sin(a)*r;k?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fill();g.strokeStyle='#c2b5ff';g.lineWidth=2;g.stroke();round(x+11,y+10,9,8,3,'#afa8ff')}
